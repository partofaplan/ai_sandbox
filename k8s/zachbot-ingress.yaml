apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zachbot-ingress
  namespace: ollama
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
spec:
  rules:
  - host: zachbot.rancher.private
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zachbot-service
            port:
              number: 80
  tls:
  - hosts:
    - zachbot.rancher.private
    secretName: zachbot-tls
