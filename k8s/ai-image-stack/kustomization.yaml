apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-image-stack

resources:
  - manifests/namespace.yaml
  - manifests/pvc.yaml
  - manifests/image-gen-deployment.yaml
  - manifests/image-gen-service.yaml
  - manifests/gallery-deployment.yaml
  - manifests/gallery-service.yaml
  - manifests/ingress.yaml

images:
  - name: partofaplan/ai-image-gen-ui
    newName: partofaplan/ai-image-gen-ui
    newTag: latest
  - name: partofaplan/ai-image-gallery
    newName: partofaplan/ai-image-gallery
    newTag: latest
