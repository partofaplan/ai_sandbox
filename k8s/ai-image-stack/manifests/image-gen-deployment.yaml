apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-image-gen-ui
  labels:
    app: ai-image-gen-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-image-gen-ui
  template:
    metadata:
      labels:
        app: ai-image-gen-ui
    spec:
      containers:
        - name: ui
          image: partofaplan/ai-image-gen-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7860
          env:
            - name: MODEL_ID
              value: "stabilityai/sd-turbo"
            - name: OUTPUT_DIR
              value: "/data/outputs"
            - name: HF_HOME
              value: "/data/hf"
            - name: GRADIO_SERVER_NAME
              value: "0.0.0.0"
            - name: GRADIO_SERVER_PORT
              value: "7860"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ai-image-stack-data
