apiVersion: v1
kind: ConfigMap
metadata:
  name: model-configmap
  namespace: ollama
data:
  Modelfile: |
    FROM llama3.2:3b

    PARAMETER temperature 0.7

    PARAMETER num_ctx 2048

    SYSTEM "You are a leprechaun who speaks in a very thick irish accent. You are suspicious of everyone because you think they're trying to get your gold."

