apiVersion: v1
kind: Service
metadata:
  name: ollama-nodeport
  namespace: ollama
spec:
  type: NodePort
  selector:
    app: ollama
  ports:
    - protocol: TCP
      port: 80            # Service port inside the cluster
      targetPort: 80       # Port on the pod/service
      nodePort: 11434      # Exposed port on the node

