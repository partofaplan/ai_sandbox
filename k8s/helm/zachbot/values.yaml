zachbot:
  replicaCount: 1
  image:
    repository: partofaplan/zachbot-go
    tag: v0.24
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: traefik
    host: zachbot.k3d.localhost
    # Additional hostnames that route to the same service
    # Pre-configured for LAN access via sslip.io
    extraHosts:
      - zachbot.k3d.local
      - zachbot.192.168.5.78.sslip.io
    path: /
    pathType: Prefix
    annotations: {}
  env:
    OLLAMA_HOST: zachbot-zachbot-ollama
    OLLAMA_PORT: "80"
    SERVER_PORT: "6600"
  resources:
    requests:
      memory: "128Mi"
      cpu: "500m"
    limits:
      memory: "700Mi"
      cpu: "1"

ollama:
  enabled: true
  image:
    repository: ollama/ollama
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: traefik
    host: ollama.k3d.localhost
    path: /
    pathType: Prefix
    annotations: {}
  nodeAffinity:
    key: node-role.kubernetes.io/control-plane
    operator: NotIn
    values:
      - "true"

penpal:
  enabled: true
  image:
    repository: zachbot
    tag: local
    pullPolicy: IfNotPresent
  env:
    OLLAMA_HOST: zachbot-zachbot-ollama
    OLLAMA_PORT: "80"
    PENPAL_MODEL: prospector:latest
    PENPAL_MAILHOG_API: http://zachbot-zachbot-mailhog:8025
    PENPAL_SMTP_HOST: zachbot-zachbot-mailhog
    PENPAL_SMTP_PORT: "1025"
    PENPAL_FROM: penpal@zachbot.local
    PENPAL_POLL_INTERVAL: 15s
  resources:
    requests:
      memory: "64Mi"
      cpu: "200m"
    limits:
      memory: "256Mi"
      cpu: "500m"

mailhog:
  enabled: true
  image:
    repository: mailhog/mailhog
    tag: latest
    pullPolicy: IfNotPresent
  service:
    smtpPort: 1025
    httpPort: 8025
  ingress:
    enabled: true
    className: traefik
    host: mailhog.k3d.localhost
    path: /
    pathType: Prefix
    annotations: {}
modelConfig:
  Modelfile: |
    FROM llama3.2:3b

    PARAMETER temperature 0.3
    PARAMETER top_k 40
    PARAMETER top_p 0.9
    PARAMETER repeat_penalty 1.1
    PARAMETER num_predict 200

    PARAMETER num_ctx 2048
