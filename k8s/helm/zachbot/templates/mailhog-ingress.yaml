{{- if and .Values.mailhog.enabled .Values.mailhog.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "zachbot.fullname" . }}-mailhog
  {{- with .Values.mailhog.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.mailhog.ingress.className }}
  rules:
    - host: {{ .Values.mailhog.ingress.host }}
      http:
        paths:
          - path: {{ .Values.mailhog.ingress.path }}
            pathType: {{ .Values.mailhog.ingress.pathType }}
            backend:
              service:
                name: {{ include "zachbot.fullname" . }}-mailhog
                port:
                  number: {{ .Values.mailhog.service.httpPort }}
{{- end }}
