name: Deploy Zachbot via Helm

on:
  push:
    paths:
      - 'k8s/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [alpha]
    environment: dev
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Configure kubeconfig
        env:
          RUNNER_KUBECONFIG: ${{ secrets.RUNNER_KUBECONFIG }}
        run: |
          set -euo pipefail
          if [ -z "${RUNNER_KUBECONFIG:-}" ]; then
            echo "RUNNER_KUBECONFIG secret not set in environment: dev" >&2
            exit 1
          fi
          KCFG_PATH="$RUNNER_TEMP/kubeconfig"
          # Write kubeconfig content from secret as-is
          printf '%s' "$RUNNER_KUBECONFIG" > "$KCFG_PATH"
          chmod 600 "$KCFG_PATH"
          echo "KUBECONFIG=$KCFG_PATH" >> "$GITHUB_ENV"

      - name: Show cluster info (sanity)
        run: |
          kubectl version --client
          kubectl cluster-info

      - name: Deploy/Upgrade Helm release
        run: |
          helm upgrade --install zachbot k8s/helm/zachbot \
            --namespace zachbot --create-namespace \
            --values k8s/helm/zachbot/values.yaml \
            --wait --timeout 5m
