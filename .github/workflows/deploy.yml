name: Deploy Zachbot via Helm

on:
  push:
    paths:
      - 'k8s/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [alpha]
    environment: dev
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      # Kubeconfig is preloaded on the runner at $HOME/.kube/config

      - name: Show cluster info (sanity)
        run: |
          kubectl version --client
          kubectl cluster-info

      - name: Deploy/Upgrade Helm release
        run: |
          helm upgrade --install zachbot k8s/helm/zachbot \
            --namespace zachbot --create-namespace \
            --values k8s/helm/zachbot/values.yaml \
            --wait --timeout 5m
