name: Deploy Zachbot via Helm

on:
  push:
    paths:
      - 'k8s/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [alpha]
    environment: dev
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Configure kubeconfig
        env:
          RANCHER_SERVER_URL: ${{ secrets.RANCHER_SERVER_URL }}
          RANCHER_CLUSTER_ID: ${{ secrets.RANCHER_CLUSTER_ID }}
          RANCHER_BEARER_TOKEN: ${{ secrets.RANCHER_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RANCHER_SERVER_URL:-}" ] || [ -z "${RANCHER_CLUSTER_ID:-}" ] || [ -z "${RANCHER_BEARER_TOKEN:-}" ]; then
            echo "Missing Rancher configuration. Ensure RANCHER_SERVER_URL, RANCHER_CLUSTER_ID, and RANCHER_BEARER_TOKEN secrets are set (environment: dev)." >&2
            exit 1
          fi
          API_BASE="${RANCHER_SERVER_URL%/}"
          K8S_SERVER="$API_BASE/k8s/clusters/${RANCHER_CLUSTER_ID}"
          KCFG_PATH="$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$KCFG_PATH"
          # Hardcode to skip TLS verification (user requested)
          kubectl config set-cluster rancher --server="$K8S_SERVER" --insecure-skip-tls-verify=true
          kubectl config set-credentials rancher-user --token="$RANCHER_BEARER_TOKEN"
          kubectl config set-context rancher-ctx --cluster=rancher --user=rancher-user
          kubectl config use-context rancher-ctx
          echo "KUBECONFIG=$KCFG_PATH" >> "$GITHUB_ENV"

      - name: Show cluster info (sanity)
        run: |
          kubectl version --client
          kubectl cluster-info

      - name: Deploy/Upgrade Helm release
        run: |
          helm upgrade --install zachbot k8s/helm/zachbot \
            --namespace zachbot --create-namespace \
            --values k8s/helm/zachbot/values.yaml \
            --wait --timeout 5m
