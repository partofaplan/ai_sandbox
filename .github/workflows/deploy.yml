name: Deploy Zachbot via Helm

on:
  push:
    paths:
      - 'k8s/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [alpha]
    environment: dev
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Configure kubeconfig
        env:
          RANCHER_SERVER_URL: ${{ secrets.RANCHER_SERVER_URL }}
          RANCHER_CLUSTER_ID: ${{ secrets.RANCHER_CLUSTER_ID }}
          RANCHER_BEARER_TOKEN: ${{ secrets.RANCHER_BEARER_TOKEN }}
          RANCHER_INSECURE_SKIP_TLS_VERIFY: ${{ secrets.RANCHER_INSECURE_SKIP_TLS_VERIFY }}
        run: |
          set -euo pipefail
          if [ -z "${RANCHER_SERVER_URL:-}" ] || [ -z "${RANCHER_CLUSTER_ID:-}" ] || [ -z "${RANCHER_BEARER_TOKEN:-}" ]; then
            echo "Missing Rancher configuration. Ensure RANCHER_SERVER_URL, RANCHER_CLUSTER_ID, and RANCHER_BEARER_TOKEN secrets are set (environment: dev)." >&2
            exit 1
          fi
          API_BASE="${RANCHER_SERVER_URL%/}"
          API_URL="$API_BASE/v3/clusters/${RANCHER_CLUSTER_ID}?action=generateKubeconfig"
          CURL_OPTS=("-sS" "-X" "POST" "-H" "Authorization: Bearer ${RANCHER_BEARER_TOKEN}" "-H" "Content-Type: application/json")
          if [ "${RANCHER_INSECURE_SKIP_TLS_VERIFY:-false}" = "true" ]; then
            CURL_OPTS+=("-k")
          fi
          echo "Requesting kubeconfig from Rancher…"
          RESP=$(curl "${CURL_OPTS[@]}" "$API_URL")
          # Extract kubeconfig YAML from JSON `config` with inline Python
          KCFG_PATH="$RUNNER_TEMP/kubeconfig"
          python3 -c 'import json,sys; d=json.load(sys.stdin); c=d.get("config");
import sys
sys.stderr.write("Failed to obtain kubeconfig from Rancher response.\n") or sys.exit(2) if not c else sys.stdout.write(c)' \
            <<< "$RESP" > "$KCFG_PATH"
          echo "KUBECONFIG=$KCFG_PATH" >> "$GITHUB_ENV"

      - name: Show cluster info (sanity)
        run: |
          kubectl version --client
          kubectl cluster-info

      - name: Deploy/Upgrade Helm release
        run: |
          helm upgrade --install zachbot k8s/helm/zachbot \
            --namespace zachbot --create-namespace \
            --values k8s/helm/zachbot/values.yaml \
            --wait --timeout 5m
