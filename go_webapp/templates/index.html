<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/static/css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zachbot</title>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Zachbot</div>
        <div id="chat-box" class="chat-box"></div>
        <div class="status-indicator" id="status-indicator"></div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Type your message..." />
            <button id="send-btn">Send</button>
        </div>
        <div class="reload-button-container">
            <button id="reload-btn" class="reload-button">Reload Model</button>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.pathname.replace(/\/$/, '');
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const reloadBtn = document.getElementById('reload-btn');
        const statusIndicator = document.getElementById('status-indicator');

        function addMessage(author, text, isBot = false, isError = false) {
            const message = document.createElement('div');
            message.classList.add('message');
            message.classList.add(isError ? 'error' : isBot ? 'bot' : 'user');
            message.textContent = text;
            chatBox.appendChild(message);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
