<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <title>Zachbot</title>
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="brand">
                <div class="logo">🤖</div>
                <div class="title">Zachbot</div>
            </div>
            <div class="header-actions">
                <button id="reload-btn" class="btn btn-ghost" title="Reload model">Reload</button>
            </div>
        </header>

        <div id="progress" class="progress hidden">
            <div class="indeterminate"></div>
        </div>

        <div class="tabs" role="tablist">
            <button class="tab-btn active" data-tab="chat" role="tab" aria-selected="true">Chat</button>
            <button class="tab-btn" data-tab="settings" role="tab" aria-selected="false">Settings</button>
        </div>

        <section id="tab-chat" class="tab-panel active" role="tabpanel" aria-label="Chat">
            <main id="chat" class="chat">
                <div id="chat-log" class="chat-log"></div>
            </main>

            <footer class="composer">
                <form id="composer-form" class="composer-form" autocomplete="off">
                    <input id="user-input" class="input" type="text" placeholder="Ask me anything..."
                           inputmode="text" enterkeyhint="send" autocomplete="off"
                           autocapitalize="sentences" autocorrect="on" spellcheck="true" />
                    <button id="send-btn" class="btn btn-primary" type="submit">Send</button>
                </form>
                <div id="status-indicator" class="status"></div>
            </footer>
        </section>

        <section id="tab-settings" class="tab-panel" role="tabpanel" aria-label="Settings">
            <div class="settings">
                <div class="setting">
                    <label for="model-select">Model</label>
                    <select id="model-select" class="input select">
                        <option value="">Loading models…</option>
                    </select>
                </div>
                <div class="setting">
                    <div class="setting-row">
                        <label for="persona-input">Persona (optional)</label>
                        <label class="switch">
                            <input type="checkbox" id="persona-toggle" />
                            <span>Apply</span>
                        </label>
                    </div>
                    <textarea id="persona-input" class="input textarea" rows="3"
                              placeholder="E.g., Reply like a pirate or Keep answers concise"></textarea>
                </div>
            </div>
        </section>
    </div>

    <script src="/static/js/app.js"></script>
    <noscript>Your browser must support JavaScript to use Zachbot.</noscript>
    
    <!-- Initial assistant message -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            window.ChatUI?.addAssistantMessage("Hi! I’m Zachbot. How can I help?");
        });
    </script>
</body>
</html>
