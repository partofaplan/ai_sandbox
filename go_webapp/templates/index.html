<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zachbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 90%;
            max-width: 600px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 80vh;
        }
        .chat-header {
            background: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            border-bottom: 1px solid #ddd;
        }
        .chat-input {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
        }
        .chat-input input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .chat-input button, .reload-button {
            margin-left: 10px;
            padding: 10px 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        .reload-button-container {
            text-align: center;
            margin-top: 10px;
        }
        .status-indicator {
            padding: 5px 10px;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Zachbot</div>
        <div id="chat-box" class="chat-box"></div>
        <div class="status-indicator" id="status-indicator"></div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Type your message..." />
            <button id="send-btn">Send</button>
        </div>
        <div class="reload-button-container">
            <button id="reload-btn" class="reload-button">Reload Model</button>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.pathname.replace(/\/$/, '');
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const reloadBtn = document.getElementById('reload-btn');
        const statusIndicator = document.getElementById('status-indicator');

        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE_URL}/health/`);
                if (!response.ok) throw new Error(`Health check failed: ${response.status}`);
                const data = await response.json();
                statusIndicator.textContent = `Status: ${data.status}`;
                statusIndicator.style.color = data.status === 'healthy' ? '#28a745' : '#dc3545';
            } catch (err) {
                console.error('Health check failed:', err);
                statusIndicator.textContent = 'Status: disconnected';
                statusIndicator.style.color = '#dc3545';
            }
        }

        function addMessage(author, text, isBot = false, isError = false) {
            const message = document.createElement('div');
            message.classList.add('message');
            message.classList.add(isError ? 'error' : isBot ? 'bot' : 'user');
            message.innerHTML = `<strong>${author}:</strong> ${text}`;
            chatBox.appendChild(message);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage(prompt) {
            try {
                const response = await fetch(`${API_BASE_URL}/chat/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ prompt })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server error: ${response.status} - ${errorText}`);
                }

                const data = await response.json();
                return data.response;
            } catch (err) {
                console.error('Request error:', err);
                throw err;
            }
        }

        sendBtn.addEventListener('click', async () => {
            const prompt = userInput.value.trim();
            if (!prompt) {
                addMessage('Error', 'Prompt cannot be empty.', false, true);
                return;
            }

            addMessage('You', prompt);
            userInput.value = '';
            sendBtn.disabled = true;

            try {
                const response = await sendMessage(prompt);
                addMessage('Bot', response, true);
            } catch (err) {
                addMessage('Error', err.message || 'Failed to connect to server.', false, true);
            } finally {
                sendBtn.disabled = false;
            }
        });

        reloadBtn.addEventListener('click', async () => {
            reloadBtn.disabled = true;
            addMessage('System', 'Reloading model...', true);

            try {
                const response = await fetch(`${API_BASE_URL}/reload-model/`, {
                    method: 'POST',
                    headers: { 'Accept': 'application/json' }
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server error: ${response.status} - ${errorText}`);
                }

                const data = await response.json();
                if (data.message) {
                    addMessage('System', data.message, true);
                } else if (data.error) {
                    throw new Error(data.error);
                }
            } catch (err) {
                console.error('Reload error:', err);
                addMessage('Error', err.message || 'Failed to reload model.', false, true);
            } finally {
                reloadBtn.disabled = false;
            }
        });

        checkHealth();
        setInterval(checkHealth, 30000);
    </script>
</body>
</html>
