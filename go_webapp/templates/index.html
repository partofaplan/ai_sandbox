<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zachbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 90%;
            max-width: 600px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 80vh;
        }
        .chat-header {
            background: #007bff;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            border-bottom: 1px solid #ddd;
        }
        .chat-box .message {
            margin-bottom: 10px;
            word-wrap: break-word;
        }
        .chat-box .message.user strong {
            color: #007bff;
        }
        .chat-box .message.bot strong {
            color: #28a745;
        }
        .chat-box .message.error strong {
            color: #dc3545;
        }
        .chat-input {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
        }
        .chat-input input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .chat-input button {
            margin-left: 10px;
            padding: 10px 15px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        .chat-input button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .chat-input button:hover:not(:disabled) {
            background: #0056b3;
        }
        .reload-button-container {
            padding: 10px;
            text-align: center;
        }
        .reload-button-container .reload-button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        .reload-button-container .reload-button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }
        .reload-button-container .reload-button:hover:not(:disabled) {
            background: #0056b3;
        }
        .status-indicator {
            padding: 5px 10px;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Zachbot</div>
        <div id="chat-box" class="chat-box"></div>
        <div class="status-indicator" id="status-indicator"></div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Type your message..." />
            <button id="send-btn">Send</button>
        </div>
        <div class="reload-button-container">
            <button id="reload-btn" class="reload-button">Reload Model</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const reloadBtn = document.getElementById('reload-btn');
        const statusIndicator = document.getElementById('status-indicator');

        async function checkHealth() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                statusIndicator.textContent = `Status: ${data.status}`;
                statusIndicator.style.color = data.status === 'healthy' ? '#28a745' : '#dc3545';
            } catch (err) {
                console.error('Health check failed:', err);
                statusIndicator.textContent = 'Status: disconnected';
                statusIndicator.style.color = '#dc3545';
            }
        }

        function addMessage(author, text, isBot = false, isError = false) {
            const message = document.createElement('div');
            message.classList.add('message');
            if (isError) {
                message.classList.add('error');
            } else if (isBot) {
                message.classList.add('bot');
            } else {
                message.classList.add('user');
            }

            const formattedText = text.split('\n').map(line => `<p>${line}</p>`).join('');
            message.innerHTML = `<strong>${author}:</strong> ${formattedText}`;
            chatBox.appendChild(message);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage(prompt) {
            try {
                console.log('Sending request with prompt:', prompt);
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ prompt })
                });

                console.log('Response status:', response.status);
                const contentType = response.headers.get('content-type');
                console.log('Response content-type:', contentType);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Error response:', errorText);
                    throw new Error(`Server error: ${response.status} - ${errorText}`);
                }

                const data = await response.json();
                console.log('Response data:', data);
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                return data.response;
            } catch (err) {
                console.error('Request error:', err);
                throw err;
            }
        }

        sendBtn.addEventListener('click', async () => {
            const prompt = userInput.value.trim();
            if (!prompt) {
                addMessage('Error', 'Prompt cannot be empty.', false, true);
                return;
            }

            addMessage('You', prompt);
            userInput.value = '';
            sendBtn.disabled = true;
            userInput.disabled = true;
            
            try {
                const response = await sendMessage(prompt);
                addMessage('Bot', response, true);
            } catch (err) {
                console.error('Error:', err);
                addMessage('Error', err.message || 'Failed to connect to server.', false, true);
            } finally {
                sendBtn.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !sendBtn.disabled) {
                sendBtn.click();
            }
        });

        reloadBtn.addEventListener('click', async () => {
            reloadBtn.disabled = true;
            addMessage('System', 'Reloading model...', true);

            try {
                const response = await fetch('/reload-model', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Server error: ${response.status} - ${errorText}`);
                }

                const data = await response.json();
                if (data.message) {
                    addMessage('System', data.message, true);
                } else if (data.error) {
                    throw new Error(data.error);
                }
            } catch (err) {
                console.error('Reload error:', err);
                addMessage('Error', err.message || 'Failed to reload model.', false, true);
            } finally {
                reloadBtn.disabled = false;
            }
        });

        // Check health status periodically
        checkHealth();
        setInterval(checkHealth, 30000); // Check every 30 seconds
    </script>
</body>
</html>
